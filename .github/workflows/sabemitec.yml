name: CI-SABEMI-TEC

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    name: BUILD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore
        run: dotnet restore SABEMI-TEC/SABEMI-TEC.sln
      - name: Build
        run: dotnet build SABEMI-TEC/SABEMI-TEC.sln --no-restore --configuration Release
  test:
    name: TESTES UNITARIOS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore
        run: dotnet restore SABEMI-TEC/SABEMI-TEC.sln
      - name: Test
        run: dotnet test SABEMI-TEC/SABEMI-TEC.sln --no-restore --configuration Release      
  sonarqube:
    name: SONARQUBECLOUD
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: SonarQubeCloud
        uses: SonarSource/sonarcloud-github-action@v6
        with:
          args: >
            -Dsonar.projectKey=fabianoCafu_SABEMI-TEC4
            -Dsonar.projectName=SABEMI-TEC
            -Dsonar.organization=fabianocafu
            -Dsonar.sources=.
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
  nuget:
    name: PUBLISH NUGET
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore
        run: dotnet restore SABEMI-TEC/SABEMI-TEC.sln
      - name: Pack
        run: dotnet pack SABEMI-TEC/SABEMI-TEC.sln --no-restore --configuration Release
